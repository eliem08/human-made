[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "human-made"
version = "0.1.0"
description = "The organic label for human-made content: proof a person made it"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
human-made = "human_made.__main__:main"

[tool.setuptools]
packages = ["human_made"]
